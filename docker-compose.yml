version: "3"
services:
  frontend:
    build: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    expose:
      - 80
    depends_on:
      - "backend"
    command: npm run start -- --host --port 80
  backend:
    build: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - 8000
    command: uvicorn --factory main:create_app --host 0.0.0.0 --port 8000
